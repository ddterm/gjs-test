name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}/${{ github.ref }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - run: npm ci
      - run: npm run lint

      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    needs:
      - lint

    container: ghcr.io/ddterm/gnome-shell-image/fedora-45:2026.10.12.0@sha256:23dd069eac48753d58640d3375af57bc669dc02b8685ed89d8642855eec90711

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - run: meson setup -Dtests=true -Dcoverage=true build
        shell: pipetty bash -e {0}

      - run: meson compile
        shell: pipetty bash -e {0}
        working-directory: build

      - run: meson test -j1 --no-rebuild --print-errorlogs --no-stdsplit
        shell: pipetty bash -e {0}
        working-directory: build

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ !cancelled() }}
        with:
          files: build/coverage.lcov
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - run: meson compile coverage-summary
        shell: pipetty bash -e {0}
        working-directory: build

  doc:
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0

      - run: npm ci
      - run: npm run doc

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: html
          name: docs-${{ github.run_attempt }}

  doc-publish:
    if: github.ref_name == github.event.repository.default_branch
    needs: doc
    runs-on: ubuntu-slim
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: docs-${{ github.run_attempt }}
